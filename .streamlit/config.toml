# Keep everything on this computer
[server]
address = "localhost"        # only this computer can open the page

[browser]
gatherUsageStats = false     # no usage statistics sent to Streamlit

# Fixed light business theme (independent of the Mac's dark mode)
[theme]
base = "light"
primaryColor = "#1f3a5f"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6f9"
textColor = "#1a1d23"

[client]
toolbarMode = "minimal"      # no "Deploy" button - this app is never deployed online
